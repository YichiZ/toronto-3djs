<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 150" width="640" height="150" role="img" aria-label="Union Station, Downtown Toronto digital twin">
  <title>Union Station — Downtown Toronto Digital Twin</title>
  <!-- Original lettering set in system faces; no network fonts, no raster, no scraped brand artwork.
       The kicked-up rule is the 1793 township survey: the Toronto grid sits 16.7 degrees west of true north. -->
  <g fill="none" stroke-linecap="square">
    <path d="M40 98 H492" stroke="#9A8F79" stroke-width="1.5"/>
    <path d="M492 98 H588" stroke="#9A8F79" stroke-width="1" stroke-dasharray="2 3" opacity="0.55"/>
    <path d="M492 98 L588 69.2" stroke="#4F7F6E" stroke-width="1.5"/>
  </g>
  <text x="40" y="78" textLength="452" lengthAdjust="spacing"
        font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif"
        font-size="56" fill="#1F2C36">UNION STATION</text>
  <text x="40" y="124" textLength="452" lengthAdjust="spacing"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="13" fill="#5A6672">DOWNTOWN TORONTO · DIGITAL TWIN</text>
  <text x="534" y="95.5"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="9" letter-spacing="0.6" fill="#4F7F6E">16.7°</text>
</svg>
